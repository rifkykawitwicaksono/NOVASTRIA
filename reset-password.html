<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18">
<title>Atur Ulang Password — NOVASTRIA</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.reset-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:32px 18px}
.reset-card{width:min(100%,440px);padding:30px;border:1px solid #ffffff20;border-radius:20px;background:linear-gradient(145deg,#171b34,#0e1225);box-shadow:0 24px 80px #0005}
.reset-card h1{font-size:28px;margin:10px 0}.reset-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:22px}
.reset-form{display:grid;gap:14px}.reset-form label{display:grid;gap:7px;font-size:12px;color:#c7cce0}
.reset-form input{width:100%;padding:13px 14px;border:1px solid #ffffff24;border-radius:10px;background:#0b1021;color:white;font:14px 'DM Sans';outline:none}
.reset-form input:focus{border-color:#9c83ff;box-shadow:0 0 0 3px #9c83ff22}
.reset-message{display:none;padding:12px;border-radius:10px;font-size:12px;line-height:1.6;background:#ffffff0b;color:#d8dcef;overflow-wrap:anywhere;margin-bottom:14px}
.reset-message.show{display:block}.reset-message.error{border:1px solid #b95b5b;color:#ffc4bd}.reset-message.success{border:1px solid #398b7e;color:#a5f2e5}
.reset-form button{width:100%}.reset-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted)}.reset-foot a{color:#c9baff}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOVASTRIA<small>ACCOUNT RECOVERY</small></span></a><a class="admin-back" id="resetBack" href="index.html">← Kembali ke toko</a></header>
<main class="reset-wrap">
<section class="reset-card">
<span class="eyebrow">NOVASTRIA / ACCOUNT SECURITY</span>
<h1>Atur ulang password</h1>
<p class="reset-desc">Gunakan tautan pemulihan yang dikirim ke email terdaftar. Buat password baru minimal 8 karakter.</p>
<div id="resetMessage" class="reset-message" role="status" aria-live="polite"></div>
<form id="resetForm" class="reset-form" hidden>
<label>Password baru<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter"></label>
<label>Ulangi password baru<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Masukkan ulang password"></label>
<button class="btn btn-primary" id="resetSubmit" type="submit">Simpan password baru</button>
</form>
<div class="reset-foot"><a id="resetFoot" href="index.html">Kembali ke halaman masuk pelanggan</a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/reset-password.js?v=customer-v1"></script>
</body>
</html>
