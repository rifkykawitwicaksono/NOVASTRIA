<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18"><title>Lupa Password — NOVASTRIA</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.forgot-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:32px 18px}
.forgot-card{width:min(100%,440px);padding:30px;border:1px solid #ffffff20;border-radius:20px;background:linear-gradient(145deg,#171b34,#0e1225);box-shadow:0 24px 80px #0005}
.forgot-card h1{font-size:28px;margin:10px 0}.forgot-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:22px}
.forgot-form{display:grid;gap:14px}.forgot-form label{display:grid;gap:7px;font-size:12px;color:#c7cce0}
.forgot-form input{width:100%;padding:13px 14px;border:1px solid #ffffff24;border-radius:10px;background:#0b1021;color:white;font:14px 'DM Sans';outline:none}
.forgot-form input:focus{border-color:#9c83ff;box-shadow:0 0 0 3px #9c83ff22}
.forgot-message{display:none;padding:12px;border-radius:10px;font-size:12px;line-height:1.6;background:#ffffff0b;color:#d8dcef;overflow-wrap:anywhere;margin-bottom:14px}
.forgot-message.show{display:block}.forgot-message.error{border:1px solid #b95b5b;color:#ffc4bd}.forgot-message.success{border:1px solid #398b7e;color:#a5f2e5}
.forgot-form button{width:100%}.forgot-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted)}.forgot-foot a{color:#c9baff}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOVASTRIA<small>ACCOUNT RECOVERY</small></span></a><a class="admin-back" href="admin-login.html">← Kembali ke login</a></header>
<main class="forgot-wrap"><section class="forgot-card">
<span class="eyebrow">NOVASTRIA / ACCOUNT SECURITY</span>
<h1>Lupa password?</h1>
<p class="forgot-desc">Masukkan email akun NOVASTRIA. Jika email terdaftar, Supabase akan mengirim tautan untuk membuat password baru.</p>
<div id="forgotMessage" class="forgot-message" role="status" aria-live="polite"></div>
<form id="forgotForm" class="forgot-form">
<label>Email akun<input id="forgotEmail" type="email" autocomplete="email" required placeholder="nama@email.com"></label>
<button class="btn btn-primary" id="forgotSubmit" type="submit">Kirim tautan pemulihan</button>
</form>
<div class="forgot-foot"><a href="admin-login.html">Kembali ke login admin</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/forgot-password.js?v=1"></script>
</body></html>
